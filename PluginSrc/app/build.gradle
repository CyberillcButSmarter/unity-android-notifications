apply plugin: 'com.android.library'

android {
    compileSdk 34
    namespace 'net.agasper.unitynotification'
    defaultConfig {
        minSdkVersion 14
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.12.0'
    implementation files('libs/classes.jar')
}

task deleteOldJar(type: Delete) {
    delete 'release/notification.jar'
}

task exportJar(type: Copy, dependsOn: [deleteOldJar, 'assembleRelease']) {
    from(zipTree("build/outputs/aar/app-release.aar")) {
        include 'classes.jar'
    }
    into('release/')
    rename('classes.jar', 'notification.jar')
}
